services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: jobradar
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobradar-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobradar"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://jobradar:${POSTGRES_PASSWORD:-jobradar-dev}@db:5432/jobradar
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://jobradar:${POSTGRES_PASSWORD:-jobradar-dev}@db:5432/jobradar
      INGEST_INTERVAL_SECONDS: "3600"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
